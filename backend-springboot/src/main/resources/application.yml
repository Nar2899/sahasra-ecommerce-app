spring:
  application:
    name: sahasra-headless-commerce
  threads:
    virtual:
      enabled: true # Java 21 Virtual Threads (Project Loom) for high-concurrency order bursts
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/sahasra_commerce
    username: ${DB_USER:sahasra_admin}
    password: ${DB_PASS:secret}
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

sahasra:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    currency: inr
  inventory:
    reservation-ttl-seconds: 600
    max-optimistic-retries: 3
